<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haru - The Corner Sign</title>
<!-- This page asked Kim to choose between three J options. She answered it by
     sending a drawing instead, so those options are superseded and must not
     stay visible. Anyone landing on the old link goes to the current page. -->
<meta http-equiv="refresh" content="0; url=../corner/">
<link rel="canonical" href="../corner/">
<link rel="stylesheet" href="../type.css">
<style>
  :root{
    --bg:#1E1F22; --surface:#26272B; --line:#3C3D3E;
    --text:#EEECE9; --muted:#959494; --accent:#e41a1c;
    --font-ui:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--font-ui);font-size:19px;line-height:1.55;
    display:flex;align-items:center;justify-content:center;min-height:100vh;
    padding:clamp(20px,5.4vw,40px);
  }
  .box{max-width:520px;text-align:center}
  h1{font-size:28px;font-weight:700;line-height:1.2;margin:0 0 12px}
  p{color:var(--muted);margin:0 0 26px}
  a{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:60px;padding:16px 28px;background:var(--accent);color:#FFFFFF;
    border-radius:14px;font-size:20px;font-weight:700;text-decoration:none;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>There is a newer page</h1>
    <p>Taking you there now.</p>
    <a href="../corner/">Open the newest page</a>
  </div>
</body>
</html>
